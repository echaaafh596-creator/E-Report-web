<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacilityCare</title>
    <!-- link remixicon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css"
        integrity="sha512-XcIsjKMcuVe0Ucj/xgIXQnytNwBttJbNjltBV18IOnru2lDPe9KRRyvCXw6Y5H415vbBLRm8+q6fmLUU7DfO6Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- link css -->
    <link rel="stylesheet" href="CSS/style.css">
    
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <i class="ri-tools-fill"></i>

            <a href="#" class="logo">Facility<span class="highlight">Care</span></a>
        </div>

        <div class="header-right">
            <a href="lapor" class="active">LAPOR!</a>

            <a href="#dashboard">DASHBOARD</a>
        </div>
    </header>

    <!-- hero section -->
    <section class="hero" id="lapor">
        <div class="page-left">
            <i class="ri-tools-fill"></i>

            <h1 class="title">Facility<span class="highlight">Care</span></h1>
            <p class="hero-p">// Pelaporan Fasilitas Sekolah</p>
            <p class="desc">Temukan masalahnya, laporkan kerusakannya, dan bantu jaga <br> fasilitas sekolah tetap
                nyaman.
            </p>
        </div>

        <div class="form-container">
            <h2>Buat Laporan Baru</h2>

            <form id="facility-report-form" autocomplete="off" onsubmit="handelFormSubmit(event)">
                <div class="form-group">
                    <label for="input-reporter">Pelapor</label>
                    <input type="text" id="input-reporter" name="reporter" placeholder="Nama lengkap / kelas">
                </div>

                <div class="form-group">
                    <label for="category">Kategori Kerusakan</label>
                    <select id="select-category" name="category">
                        <option value="" selected disabled>
                            Pilih Kategori Kerusakan
                        </option>
                        <option value="AC">AC</option>
                        <option value="Komputer">Komputer</option>
                        <option value="Furnitur">Furnitur</option>
                        <option value="Sanitasi">Sanitasi</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="textarea">Deskripsi</label>
                    <textarea id="textarea" name="description" rows="9"
                        placeholder="Jelaskan detail kerusakan dan tempatnya..." maxlength="200"></textarea>
                </div>

                <button type="submit">Kirim Laporan</button>
            </form>
        </div>
    </section>

    <section class="dashboard" id="dashboard">

        <!-- atas -->
        <div class="stats-container">

            <div class="stat-box">
                <h1>05</h1>
                <p>Kerusakan Dilaporkan</p>
            </div>

            <div class="stat-box">
                <h1>02</h1>
                <p>Kerusakan Diperbaiki</p>
            </div>

            <div class="stat-box">
                <h1 class="waiting-number">03</h1>
                <p class="stat-desc">Menunggu Proses</p>
            </div>

        </div>

        <!-- kategori -->
        <div class="filter-container">
            <button class="filter-btn active">SEMUA (05)</button>
            <button class="filter-btn">Menunggu (03)</button>
            <button class="filter-btn">Selesai (02)</button>
        </div>

        <!-- tabel -->
        <div class="table-container">

            <table class="report-table">

                <thead>
                    <tr>
                        <th>Pelapor</th>
                        <th>Kategori</th>
                        <th>Deskripsi</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="reports-table-body">



                </tbody>

            </table>

        </div>

    </section>


    <!-- js -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
